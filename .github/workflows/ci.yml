name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev nlohmann-json3-dev

      - name: Compile C++ Telemetry Agent
        run: |
          cd backend/src
          g++ -O2 -std=c++17 utility.cpp -o telemetry_agent -lcurl
          ls -lh telemetry_agent

      - name: Run C++ Unit Tests
        run: |
          cd backend/tests
          g++ -O2 -std=c++17 test_metrics.cpp -o test_metrics
          ./test_metrics

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM CloudFormation Template
        env:
          AWS_DEFAULT_REGION: ap-southeast-2
        run: |
          sam validate --template-file backend/aws/template.yaml --region ap-southeast-2
